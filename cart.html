<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amour & Fleur | Cart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="images/logo (1).png" alt="Amour & Fleur Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- CART -->
    <main class="cart-container">
        <h2>Shopping Cart</h2>

        <!-- CART ITEMS -->
        <div id="cart-items"></div>

        <!-- EMPTY CART MESSAGE -->
        <div id="empty-cart" class="empty-cart">
            <i class="fa-solid fa-basket-shopping"></i>
            <h3>Your cart is empty</h3>
            <p>You haven't added any flowers to your cart yet.</p>
            <a href="shop.html" class="continue-shopping">Continue Shopping</a>
        </div>

        <!-- CART TOTAL -->
        <div class="cart-bottom">
            <div class="cart-total">
                <strong>Total:</strong>
                <span>₱<span id="total">0</span></span>
            </div>
            <button type="button" class="checkout-btn" id="checkout-btn">
                Proceed to Checkout
            </button>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        const cartContainer = document.getElementById("cart-items");
        const totalElement = document.getElementById("total");
        const emptyCart = document.getElementById("empty-cart");
        const checkoutButton = document.getElementById("checkout-btn");

        // =====================================================
        // GET CART FROM LOCAL STORAGE
        // =====================================================

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // =====================================================
        // FORMAT PRICE
        // =====================================================

        function formatPrice(price) {
            const numericPrice = parseFloat(String(price).replace(/[₱,]/g, "")) || 0;
            return numericPrice.toLocaleString("en-PH", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        // =====================================================
        // GET NUMERIC PRICE
        // =====================================================

        function getPrice(price) {
            return parseFloat(String(price).replace(/[₱,]/g, "")) || 0;
        }

        // =====================================================
        // DISPLAY CART
        // =====================================================

        function displayCart() {
            cartContainer.innerHTML = "";
            let total = 0;

            // EMPTY CART
            if (cart.length === 0) {
                emptyCart.style.display = "block";
                checkoutButton.disabled = true;
                checkoutButton.style.opacity = "0.5";
                checkoutButton.style.cursor = "not-allowed";
                totalElement.textContent = "0";
                return;
            }

            // CART HAS ITEMS
            emptyCart.style.display = "none";
            checkoutButton.disabled = false;
            checkoutButton.style.opacity = "1";
            checkoutButton.style.cursor = "pointer";

            // DISPLAY EACH ITEM
            cart.forEach((item, index) => {
                const price = getPrice(item.price);
                total += price;

                const div = document.createElement("div");
                div.classList.add("cart-item");

                div.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>₱${formatPrice(price)}</p>
                    </div>
                    <button type="button" class="remove-btn" data-index="${index}" aria-label="Remove ${item.name}">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;

                cartContainer.appendChild(div);
            });

            // DISPLAY TOTAL
            totalElement.textContent = formatPrice(total);
        }

        // =====================================================
        // REMOVE ITEM
        // =====================================================

        cartContainer.addEventListener("click", function (e) {
            const removeButton = e.target.closest(".remove-btn");
            if (!removeButton) return;

            const index = parseInt(removeButton.dataset.index);
            if (isNaN(index) || index < 0 || index >= cart.length) return;

            // Remove item
            cart.splice(index, 1);

            // Update localStorage
            localStorage.setItem("cart", JSON.stringify(cart));

            // Refresh cart
            displayCart();
        });

        // =====================================================
        // PROCEED TO CHECKOUT
        // =====================================================

        checkoutButton.addEventListener("click", function () {
            if (cart.length === 0) {
                alert("Your cart is empty. Please add an item before proceeding to checkout.");
                return;
            }

            // Go to checkout page
            window.location.href = "checkout.html";
        });

        // =====================================================
        // INITIAL DISPLAY
        // =====================================================

        displayCart();
    </script>

</body>
</html>
