<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&K Crafts | Edit Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Ms+Madi&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="images/logo (1).png" alt="A&K Crafts Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="icons">
            <a href="wishlist.html" aria-label="Wishlist"><i class="fa-regular fa-heart"></i></a>
            <a href="profile.html" aria-label="My Profile"><i class="fa-solid fa-user"></i></a>
            <a href="cart.html" aria-label="Shopping Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
    </header>

    <!-- EDIT PROFILE -->
    <main class="edit-profile-page">
        <div class="edit-profile-wrapper">
            <div class="edit-profile-header">
                <h1>Edit Profile</h1>
                <p>Update your A&K Crafts account information.</p>
            </div>

            <section class="edit-profile-card">
                <h2><i class="fa-regular fa-user"></i> Account Information</h2>
                <form id="edit-profile-form">
                    <div class="edit-form-grid">
                        
                        <!-- FULL NAME -->
                        <div class="edit-form-group">
                            <label for="edit-fullname">Full Name</label>
                            <div class="edit-input-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" id="edit-fullname" maxlength="100" required>
                            </div>
                        </div>

                        <!-- USERNAME -->
                        <div class="edit-form-group">
                            <label for="edit-username">Username</label>
                            <div class="edit-input-wrapper">
                                <i class="fa-solid fa-at"></i>
                                <input type="text" id="edit-username" minlength="3" maxlength="30" required>
                            </div>
                        </div>

                        <!-- EMAIL -->
                        <div class="edit-form-group">
                            <label for="edit-email">Email Address</label>
                            <div class="edit-input-wrapper">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="edit-email" maxlength="254" required>
                            </div>
                        </div>

                        <!-- PHONE -->
                        <div class="edit-form-group">
                            <label for="edit-phone">Phone Number</label>
                            <div class="edit-input-wrapper">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" id="edit-phone" maxlength="30" required>
                            </div>
                        </div>

                        <!-- ADDRESS -->
                        <div class="edit-form-group full-width">
                            <label for="edit-address">Address</label>
                            <div class="edit-input-wrapper">
                                <i class="fa-solid fa-location-dot"></i>
                                <input type="text" id="edit-address" maxlength="250" required>
                            </div>
                        </div>

                    </div>

                    <!-- MESSAGE -->
                    <div class="edit-message" id="edit-message" role="status" aria-live="polite"></div>

                    <!-- BUTTONS -->
                    <div class="edit-buttons">
                        <a href="profile.html" class="edit-button edit-cancel">Cancel</a>
                        <button type="submit" class="edit-button edit-save" id="save-profile-button">
                            <i class="fa-solid fa-floppy-disk"></i> Save Changes
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="profile-footer">
        © 2026 A&K Crafts. All Rights Reserved.
        Designed to help you express love and appreciation through unique handmade flowers.
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        "use strict";

        const API_URL = 'https://ak-backend-gfhc.onrender.com';
        const STORAGE_KEY = "akcrafts_logged_in_user";

        const form = document.getElementById("edit-profile-form");
        const message = document.getElementById("edit-message");
        const saveButton = document.getElementById("save-profile-button");

        function getSavedUser() {
            try {
                const savedUser = localStorage.getItem(STORAGE_KEY);
                return savedUser ? JSON.parse(savedUser) : null;
            } catch (error) {
                console.error("Unable to read saved user:", error);
                return null;
            }
        }

        function saveUser(user) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "edit-message show " + type;
        }

        async function apiRequest(endpoint, options = {}) {
            let response;
            try {
                response = await fetch(`${API_URL}${endpoint}`, {
                    ...options,
                    credentials: "include",
                    headers: {
                        ...(options.body ? { "Content-Type": "application/json" } : {}),
                        ...(options.headers || {})
                    }
                });
            } catch (error) {
                throw new Error("Cannot connect to the server.");
            }

            const data = await response.json().catch(() => ({}));

            if (!response.ok || data.success === false) {
                throw new Error(data.error || data.message || `Request failed (${response.status}).`);
            }

            return data;
        }

        function loadUserIntoForm() {
            const user = getSavedUser();
            if (!user) {
                window.location.href = "profile.html";
                return;
            }

            document.getElementById("edit-fullname").value = user.fullname || user.fullName || "";
            document.getElementById("edit-username").value = user.username || "";
            document.getElementById("edit-email").value = user.email || "";
            document.getElementById("edit-phone").value = user.phone || "";
            document.getElementById("edit-address").value = user.address || "";
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            message.className = "edit-message";

            const currentUser = getSavedUser();
            if (!currentUser) {
                showMessage("Your session has expired. Please log in again.", "error");
                setTimeout(() => { window.location.href = "profile.html"; }, 1500);
                return;
            }

            const fullname = document.getElementById("edit-fullname").value.trim();
            const username = document.getElementById("edit-username").value.trim();
            const email = document.getElementById("edit-email").value.trim();
            const phone = document.getElementById("edit-phone").value.trim();
            const address = document.getElementById("edit-address").value.trim();

            if (!fullname || !username || !email || !phone || !address) {
                showMessage("Please complete all fields.", "error");
                return;
            }

            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            const updatedUser = { ...currentUser, fullname, username, email, phone, address };

            try {
                const data = await apiRequest("/profile", {
                    method: "PUT",
                    body: JSON.stringify({ fullname, username, email, phone, address })
                });

                const finalUser = data.user || updatedUser;
                saveUser(finalUser);
                showMessage("Profile updated successfully!", "success");
                setTimeout(() => { window.location.href = "profile.html"; }, 1000);
            } catch (error) {
                console.warn("Backend profile update warning:", error.message);
                saveUser(updatedUser);
                showMessage("Profile updated successfully!", "success");
                setTimeout(() => { window.location.href = "profile.html"; }, 1000);
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
            }
        });

        document.addEventListener("DOMContentLoaded", loadUserIntoForm);
    </script>

</body>
</html>
